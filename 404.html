<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0d0b">
<title>CLOUTS — página não encontrada</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:#0e0d0b;color:#fdf2df;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px;text-align:center}
main{display:grid;justify-items:center;gap:14px;max-width:360px}
img{height:84px;width:auto}
.w{font-family:Georgia,'Cormorant Garamond',serif;font-weight:600;letter-spacing:.42em;margin-right:-.42em;font-size:30px;color:#fff}
.t{font-size:10px;letter-spacing:.4em;color:#cea147;font-weight:600}
.n{font-family:Georgia,serif;font-size:72px;color:#cea147;line-height:1;margin-top:14px}
h1{font-family:Georgia,serif;font-weight:500;font-size:26px}
p{color:#cbbf9f;font-size:14px;line-height:1.5}
a{margin-top:6px;display:inline-grid;place-items:center;height:46px;padding:0 28px;border-radius:99px;background:#cea147;color:#0e0d0b;font-weight:700;font-size:13px;letter-spacing:.06em;text-decoration:none}
a:hover{background:#b0842d;color:#fff}
</style>
</head>
<body>
<main>
  <img src="/img/logo.png" alt="">
  <div class="w">CLOUTS</div>
  <div class="t">VISTA SEU MELHOR.</div>
  <div class="n">404</div>
  <h1>Página não encontrada</h1>
  <p>O endereço pode ter mudado. Volte para a loja e continue escolhendo suas calças.</p>

</body>
